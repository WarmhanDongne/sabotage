name: sabotage
description: "사보타지 디지털 보드게임 - 태블릿/모바일 앱"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase 및 Firestore 연동
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.1

  # 상태 관리 및 라우팅
  provider: ^6.1.2

  # Cupertino 아이콘 (iOS 스타일)
  cupertino_icons: ^1.0.6
  google_fonts: ^6.3.0
  material_symbols_icons: ^4.2951.0
  firebase_auth: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # 이미지 및 룰북 에셋 등록 (필요시 추가 활성화 가능)
  assets:
    - assets/board_info/001_action/
    - assets/board_info/002_dwarves/
    - assets/board_info/003_gold_card/
    - assets/board_info/004_path/
    - assets/board_info/005_start_and_end_point_card/
    - assets/board_info/006_card_back_side/
    - assets/phone_info/
    - assets/start_the_game/
    - assets/using_loadcard_/
    - assets/using_loadmap_card/
