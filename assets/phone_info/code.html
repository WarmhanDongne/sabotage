        /* Identity Slide Interaction */
        .identity-trigger {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 40px;
            z-index: 100;
            display: flex;
            justify-content: center;
        }

        .identity-card-wrapper {
            position: fixed;
            bottom: -160px;
            left: 50%;
            transform: translateX(-50%);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            z-index: 50;

        .identity-card-wrapper:hover {
            bottom: 40px; /* Moved up to clear table edge and look centered relative to play area */
            transform: translateX(-50%) scale(1.2);

<script>
        // Atmospheric dust particles
        const particleContainer = document.getElementById('particles');
        const particleCount = 25;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'absolute bg-primary-container/30 rounded-full blur-[1px]';
            const size = Math.random() * 2 + 1;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.top = `${Math.random() * 100}%`;
            
            const duration = Math.random() * 20 + 15;
            const delay = Math.random() * -30;
            
            particle.style.animation = `float ${duration}s linear infinite ${delay}s`;
            particleContainer.appendChild(particle);
        }

        const style = document.createElement('style');
        style.textContent = `
            @keyframes float {
                0% { transform: translateY(0) translateX(0) opacity: 0; }
                20% { opacity: 0.8; }
                80% { opacity: 0.8; }
                100% { transform: translateY(-110vh) translateX(${Math.random() * 80 - 40}px); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        // Card interaction logic
        document.querySelectorAll('.fan-card').forEach(card => {
            card.addEventListener('click', () => {
                const currentTransform = card.style.transform;
                card.style.transition = 'all 0.25s ease-out';
                card.style.transform = currentTransform.replace(/translateY\(.*?\)/, 'translateY(-160px)') + ' scale(1.1)';
                card.style.zIndex = '100';
                
                setTimeout(() => {
                    card.style.transition = 'all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                }, 250);
            });
        });
    </script>
